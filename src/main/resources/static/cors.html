<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>test</title>
    </head>
    <script>
        function callApi() {
            fetch('http://localhost:8080/api-test/user')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data);
                    alert('API 호출 완료!');
                })
                .catch(error => {
                    document.getElementById('result').textContent = error;
                });
        }
    </script>
    <body>
        <button onclick="callApi()">API 호출</button>
        <div id="result"></div>
    </body>
</html>
